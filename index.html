<!DOCTYPE html>
<html lang="en">
<head>
  <title>Google Search</title>
</head>
<body>
  <div class="nav">
    <a href="images.html">Image Search</a>
    <a href="advanced.html">Advanced Search</a>
  </div>

  <form action="https://www.google.com/search">
    <input type="text" name="q" class="search-box">
    <br>
    <input type="submit" value="Google Search" class="search-button">
  </form>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 15%;
    }
    .search-box {
      border-radius: 25px;
      border: 1px solid #ccc;
      padding: 10px;
      width: 400px;
    }
    .nav {
      position: absolute;
      top: 10px;
      right: 20px;
    }
    .nav a {
      margin-left: 15px;
      text-decoration: none;
      color: #1a0dab;
    }
    .search-button {
      margin-top: 20px;
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid #ccc;
      background-color: #f8f9fa;
      cursor: pointer;
    }
  </style>
</body>
</html>
