<!DOCTYPE html>
<html lang="en">
<head>
  <title>Google Search</title>
</head>
<body>
  <!-- Google logo -->
  <div class="logo">
    <img src="https://images.google.com/images/branding/google_wordmark/v1/1x/googlelogo_white_272x92dp.png" alt="Google Logo">
  </div>

  <div class="nav">
    <a href="images.html">Image Search</a>
    <a href="advanced.html">Advanced Search</a>
  </div>

  <form action="https://www.google.com/search" method="get">
    <input type="text" name="q" class="search-box"><br>
    <input type="submit" value="Google Search" class="search-button">
    <input type="submit" value="I'm Feeling Lucky" name="btnI" class="search-button">
  </form>

  <style>

    body {
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      margin-top: 10%;
      background-color: #22242a;
    }
    .logo {
      margin-bottom: 20px;
    }
    .logo img {
      width: 272px; 
      height: auto;
    }
    .search-box {
      border-radius: 25px;
      border: 1px solid #dcdcdc;
      padding: 10px;
      width: 400px;
      outline: none;
    }
    .nav {
      position: absolute;
      top: 10px;
      right: 20px;
    }
    .nav a {
      margin-left: 15px;
      text-decoration: none;
      color: #e3e3e3;
      font-size: 14px;
    }
    .search-button {
      margin-top: 20px;
      padding: 10px 20px;
      border-radius: 4px;
      border: 1px solid #303134;
      background-color: #303134;
      color: #e3e3e3;
      cursor: pointer;
      font-size: 14px;
    }
    .search-button:hover {
      border: 1px solid #c6c6c6;
    }
  </style>
</body>
</html>
