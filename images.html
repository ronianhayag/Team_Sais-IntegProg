<!DOCTYPE html>
<html lang="en">
<head>
  <title>Google Images</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #22242a;
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 420px;
    }

    .back-button {
      display: inline-block;
      margin-top: 20px;
      background-color: #303134;
      color: #e3e3e3;
      border: 1px solid #303134;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 12px;
      text-decoration: none;
    }

    .back-button:hover {
      border: 1px solid #e3e3e3;
    }

    .logo {
      display: inline-block;
      margin: 0 0 24px;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .google-word {
      display: block;
      font-size: 72px;
      font-weight: 700;
      color: #fff;
      line-height: 0.95;
      letter-spacing: -1px;
      font-family: Arial, sans-serif;
    }

    .images-word {
      display: block;
      margin-left: 105px;
      font-size: 18px;
      color: #4285f4;
      text-align: right;
      font-weight: 300;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .search-form {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid #dfe1e5;
      border-radius: 999px;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.16);
      padding: 0 12px;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .search-wrapper:hover {
      box-shadow: 0 1px 8px rgba(32, 33, 36, 0.2);
    }

    .search-wrapper:focus-within {
      box-shadow: 0 1px 8px rgba(32, 33, 36, 0.2);
      border-color: #dfe1e5;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      padding: 14px 8px;
      font-size: 16px;
      background: transparent;
      color: #202124;
      border-radius: 999px;
    }

    .search-input::placeholder {
      color: #9aa0a6;
    }

    .search-button {
      display: none;
      border: none;
      background: #303134;
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      margin-left: 6px;
    }

    .search-wrapper:focus-within .search-button,
    .search-input:not(:placeholder-shown) + .search-button {
      display: inline-block;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1 class="logo">
      <span class="google-word">Google</span>
      <span class="images-word">Images</span>
    </h1>
    <form action="https://www.google.com/search" method="GET" class="search-form">
      <input type="hidden" name="tbm" value="isch">
      <div class="search-wrapper">
        <input type="text" name="q" class="search-input" autocomplete="off">
        <button type="submit" class="search-button">Search</button>
      </div>
    </form>
    
    <a href="index.html" class="back-button">Google Search</a>
  </div>
</body>
</html>
