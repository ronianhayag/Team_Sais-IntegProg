<!DOCTYPE html>
<html lang="en">
<head>
  <title>Google Search</title>
</head>
<body>
  <div class="nav">
    <a href="images.html">Image Search</a>
    <a href="advanced.html">Advanced Search</a>
  </div>

  <form action="https://www.google.com/search" method="get">
    <input type="text" name="q" class="search-box"><br>
    <input type="submit" value="Google Search" class="search-button">
    <input type="submit" value="I'm Feeling Lucky" name="btnI" class="search-button lucky">
  </form>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 15%;
      background-color: #fff;
    }
    .search-box {
      border-radius: 25px;
      border: 1px solid #dcdcdc;
      padding: 10px;
      width: 400px;
      outline: none;
    }
    .nav {
      position: absolute;
      top: 10px;
      right: 20px;
    }
    .nav a {
      margin-left: 15px;
      text-decoration: none;
      color: #1a0dab;
      font-size: 14px;
    }
    .search-button {
      margin-top: 20px;
      padding: 10px 20px;
      border-radius: 4px;
      border: 1px solid #dcdcdc;
      background-color: #f8f9fa;
      cursor: pointer;
      font-size: 14px;
    }
    .search-button:hover {
      border: 1px solid #c6c6c6;
    }
    .lucky {
      margin-left: 10px;
    }
  </style>
</body>
</html>
