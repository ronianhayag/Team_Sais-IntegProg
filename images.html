<!DOCTYPE html>
<html lang="en">
<head>
  <title>Google Images</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
    }

    .back-button {
      display: inline-block;
      margin-top: 20px;
      background-color: black;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    h1 {
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>Google Images</h1>
    <form action="https://www.google.com/search" method="GET">
      <input type="hidden" name="tbm" value="isch">
      <input type="text" name="q" placeholder="Search images" autocomplete="off">
      <input type="submit" value="Search">
    </form>
    
    <a href="index.html" class="back-button">Go Back To Google Search</a>
  </div>
</body>
</html>
