<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Google Advanced Search</title>

    </head>
    <body>
        <form action="https://www.google.com/search" method="get">
            <div class="field-group">
                <label for="all-words">All these words:</label>
                <input type="text" id="all-words" name="as_q" placeholder="e.g. team saas marketing">
            </div>
            <div class="field-group">
                <label for="exact-phrase">This exact word or phrase:</label>
                <input type="text" id="exact-phrase" name="as_epq" placeholder="e.g. advanced search">
            </div>
            <div class="field-group">
                <label for="any-words">Any of these words:</label>
                <input type="text" id="any-words" name="as_oq" placeholder="e.g. seo html css">
            </div>
            <div class="field-group">
                <label for="none-words">None of these words:</label>
                <input type="text" id="none-words" name="as_eq" placeholder="e.g. javascript">
            </div>
            <button type="submit" class="advanced-submit">Advanced Search</button>
        </form>
    </body>
</html>
